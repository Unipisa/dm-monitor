name: Deploy Static Content to Pages

# see https://vitejs.dev/guide/static-deploy

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 21
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build -- --base=/dm-monitor/

      - name: Write deployed version
        run: |
          node -e 'require("node:fs").writeFileSync("dist/version.json", JSON.stringify({commit: process.env.GITHUB_SHA}) + "\n")'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
    
      - name: Setup Pages
        uses: actions/configure-pages@v3
        
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
